# Copy to .github/workflows/senior-review.yml in your forge workspace repo.
#
# The review is posted by the built-in github-actions bot (no second account).
# One-time setup in the workspace repo:
#   Settings → Actions → General → Workflow permissions:
#     tick "Allow GitHub Actions to create and approve pull requests".
#   Settings → Secrets and variables → Actions:
#     secret   CLAUDE_CODE_OAUTH_TOKEN  output of `claude setup-token` (your Claude plan)
#     secret   FORGE_COURSE_TOKEN       fine-grained PAT, only the cpp-forge repo,
#                                       "Contents: read-only" (the course repo is private)
#     variable FORGE_COURSE_REPO        e.g. nb923/cpp-forge
#   Branch protection / ruleset for `main`: require the status check
#   "forge/senior-review" (and optionally 1 approving review). Nothing merges
#   until the senior reviewer approves. Private repos need GitHub Pro for this.
name: senior-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write   # post the review (APPROVE / REQUEST_CHANGES)
  statuses: write        # set forge/senior-review

concurrency:
  group: senior-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.FORGE_COURSE_REPO }}
          token: ${{ secrets.FORGE_COURSE_TOKEN }}
          path: .cpp-forge

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run stage tests
        id: tests
        continue-on-error: true
        env:
          FORGE_COURSE_ROOT: .cpp-forge   # the course checkout, not the path recorded at `forge init`
        run: |
          python .cpp-forge/forge.py test --ci --workspace . > forge-tests.txt 2>&1
          cat forge-tests.txt

      - name: Senior review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd .cpp-forge
          python -m forge.github_bot \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --backend claude-cli \
            --workdir "$GITHUB_WORKSPACE" \
            --test-summary "$GITHUB_WORKSPACE/forge-tests.txt"
